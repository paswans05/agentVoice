[general]
static=yes
writeprotect=no
autofallthrough=yes

[from-internal]
; Internal SIP & WebRTC extensions
exten => 1001,1,NoOp(Internal call to extension 1001)
 same => n,Dial(PJSIP/1001,30,tT)
 same => n,Hangup()

exten => 1002,1,NoOp(Internal call to extension 1002)
 same => n,Dial(PJSIP/1002,30,tT)
 same => n,Hangup()

; Browser WebRTC extension aliases
exten => 1001-ws,1,NoOp(Internal WebRTC call to 1001-ws)
 same => n,Dial(PJSIP/1001-ws,30,tT)
 same => n,Hangup()

exten => 1002-ws,1,NoOp(Internal WebRTC call to 1002-ws)
 same => n,Dial(PJSIP/1002-ws,30,tT)
 same => n,Hangup()

; Echo test extension 600
exten => 600,1,NoOp(Asterisk Echo Test)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; AI Voice Agent internal extension (routes into ARI Stasis app)
exten => 700,1,NoOp(AgentVoice AI Assistant)
 same => n,Answer()
 same => n,Stasis(agentvoice,ai-agent)
 same => n,Hangup()

; Pattern for campaign/AI Stasis calls
exten => _9XXX,1,NoOp(AgentVoice Stasis route for ${EXTEN})
 same => n,Answer()
 same => n,Stasis(agentvoice,${EXTEN})
 same => n,Hangup()

[agentvoice-stasis]
exten => _X.,1,NoOp(ARI Stasis entry for ${EXTEN})
 same => n,Answer()
 same => n,Stasis(agentvoice,${EXTEN})
 same => n,Hangup()

; =============================================================================
; External SIP Trunk Contexts (Inactive until sip-trunk-external is loaded)
; =============================================================================
[from-trunk-external]
exten => _+X.,1,NoOp(Inbound SIP trunk call to ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(agentvoice,inbound,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

exten => _X.,1,NoOp(Inbound SIP trunk call to ${EXTEN} from ${CALLERID(num)})
 same => n,Stasis(agentvoice,inbound,${EXTEN},${CALLERID(num)})
 same => n,Hangup()

[to-trunk-external]
; Guarded outbound trunk context: only reachable via authorized ARI origination
exten => _+91XXXXXXXXXX,1,NoOp(Authorized Indian mobile outbound to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@sip-trunk-external,60)
 same => n,Hangup()
