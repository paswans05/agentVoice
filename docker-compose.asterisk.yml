# Optional local development Asterisk PBX setup for agentVoice Phase 10.
# Bind ARI and SIP ports to localhost / private network only — do NOT expose publicly.
services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: agentvoice-asterisk-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:10000-10018:10000-10018/udp"
    volumes:
      - ./docker/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./docker/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
    environment:
      - ARI_USER=${ASTERISK_ARI_USER:-agentvoice}
      - ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:-change-me-local-dev}
      - EXT_1001_PASSWORD=${ASTERISK_EXT_1001_PASSWORD:-agentvoice-ext-1001}
      - EXT_1002_PASSWORD=${ASTERISK_EXT_1002_PASSWORD:-agentvoice-ext-1002}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF >/etc/asterisk/ari.conf
        [general]
        enabled = yes
        pretty = yes

        [$${ARI_USER}]
        type = user
        read_only = no
        password = $${ARI_PASSWORD}
        EOF
        cat <<EOF >/etc/asterisk/pjsip.conf
        [transport-udp]
        type=transport
        protocol=udp
        bind=0.0.0.0:5060

        [transport-ws]
        type=transport
        protocol=ws
        bind=0.0.0.0:8088

        [1001]
        type=endpoint
        context=from-internal
        disallow=all
        allow=ulaw,alaw,opus
        auth=1001
        aors=1001
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1001]
        type=auth
        auth_type=userpass
        username=1001
        password=$${EXT_1001_PASSWORD}

        [1001]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1002]
        type=endpoint
        context=from-internal
        disallow=all
        allow=ulaw,alaw,opus
        auth=1002
        aors=1002
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1002]
        type=auth
        auth_type=userpass
        username=1002
        password=$${EXT_1002_PASSWORD}

        [1002]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1001-ws]
        type=endpoint
        context=from-internal
        disallow=all
        allow=opus,ulaw,alaw
        auth=1001-ws
        aors=1001-ws
        webrtc=yes
        dtls_auto_generate_cert=yes
        use_avpf=yes
        media_encryption=dtls
        dtls_verify=fingerprint
        dtls_setup=actpass
        ice_support=yes
        media_use_received_transport=yes
        rtcp_mux=yes
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1001-ws]
        type=auth
        auth_type=userpass
        username=1001-ws
        password=$${EXT_1001_PASSWORD}

        [1001-ws]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1002-ws]
        type=endpoint
        context=from-internal
        disallow=all
        allow=opus,ulaw,alaw
        auth=1002-ws
        aors=1002-ws
        webrtc=yes
        dtls_auto_generate_cert=yes
        use_avpf=yes
        media_encryption=dtls
        dtls_verify=fingerprint
        dtls_setup=actpass
        ice_support=yes
        media_use_received_transport=yes
        rtcp_mux=yes
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1002-ws]
        type=auth
        auth_type=userpass
        username=1002-ws
        password=$${EXT_1002_PASSWORD}

        [1002-ws]
        type=aor
        max_contacts=2
        remove_existing=yes
        EOF
        exec /usr/local/bin/entrypoint.sh /usr/sbin/asterisk -vvvdddf -T -W -U asterisk -p
