services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: agentvoice-api
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      STORAGE_BACKEND: json
      DATA_DIR: /data/agentvoice-data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./agentvoice-data:/data/agentvoice-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: agentvoice-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
