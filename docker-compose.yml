services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: agentvoice-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      STORAGE_BACKEND: json
      DATA_DIR: /data/agentvoice-data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AGENTVOICE_SECRET_KEY: ${AGENTVOICE_SECRET_KEY:-change-me-in-production}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agentvoice-data:/data/agentvoice-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: agentvoice-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  phone-web:
    build:
      context: .
      dockerfile: docker/phone-web.Dockerfile
    container_name: agentvoice-phone-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      api:
        condition: service_healthy

  asterisk:
    image: andrius/asterisk:latest
    container_name: agentvoice-asterisk
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:5060:5060/udp"
      - "127.0.0.1:5060:5060/tcp"
      - "127.0.0.1:10000-10018:10000-10018/udp"
    volumes:
      - ./docker/asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/asterisk/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./docker/asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
    environment:
      ARI_USER: ${ASTERISK_ARI_USER:-agentvoice}
      ARI_PASSWORD: ${ASTERISK_ARI_PASSWORD:-change-me-local-dev}
      EXT_1001_PASSWORD: ${ASTERISK_EXT_1001_PASSWORD:-agentvoice-ext-1001}
      EXT_1002_PASSWORD: ${ASTERISK_EXT_1002_PASSWORD:-agentvoice-ext-1002}
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat <<EOF >/etc/asterisk/ari.conf
        [general]
        enabled = yes
        pretty = yes

        [$${ARI_USER}]
        type = user
        read_only = no
        password = $${ARI_PASSWORD}
        EOF
        cat <<EOF >/etc/asterisk/pjsip.conf
        [transport-udp]
        type=transport
        protocol=udp
        bind=0.0.0.0:5060

        [transport-ws]
        type=transport
        protocol=ws
        bind=0.0.0.0:8088

        [1001]
        type=endpoint
        context=from-internal
        disallow=all
        allow=ulaw,alaw,opus
        auth=1001
        aors=1001
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1001]
        type=auth
        auth_type=userpass
        username=1001
        password=$${EXT_1001_PASSWORD}

        [1001]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1002]
        type=endpoint
        context=from-internal
        disallow=all
        allow=ulaw,alaw,opus
        auth=1002
        aors=1002
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1002]
        type=auth
        auth_type=userpass
        username=1002
        password=$${EXT_1002_PASSWORD}

        [1002]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1001-ws]
        type=endpoint
        context=from-internal
        disallow=all
        allow=opus,ulaw,alaw
        auth=1001-ws
        aors=1001-ws
        webrtc=yes
        dtls_auto_generate_cert=yes
        use_avpf=yes
        media_encryption=dtls
        dtls_verify=fingerprint
        dtls_setup=actpass
        ice_support=yes
        media_use_received_transport=yes
        rtcp_mux=yes
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1001-ws]
        type=auth
        auth_type=userpass
        username=1001-ws
        password=$${EXT_1001_PASSWORD}

        [1001-ws]
        type=aor
        max_contacts=2
        remove_existing=yes

        [1002-ws]
        type=endpoint
        context=from-internal
        disallow=all
        allow=opus,ulaw,alaw
        auth=1002-ws
        aors=1002-ws
        webrtc=yes
        dtls_auto_generate_cert=yes
        use_avpf=yes
        media_encryption=dtls
        dtls_verify=fingerprint
        dtls_setup=actpass
        ice_support=yes
        media_use_received_transport=yes
        rtcp_mux=yes
        direct_media=no
        rtp_symmetric=yes
        force_rport=yes
        rewrite_contact=yes

        [1002-ws]
        type=auth
        auth_type=userpass
        username=1002-ws
        password=$${EXT_1002_PASSWORD}

        [1002-ws]
        type=aor
        max_contacts=2
        remove_existing=yes
        EOF
        exec /usr/local/bin/entrypoint.sh /usr/sbin/asterisk -vvvdddf -T -W -U asterisk -p

  caddy:
    image: caddy:2-alpine
    container_name: agentvoice-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "8443:8443"
    volumes:
      - ./docker/caddy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    depends_on:
      - api
      - web
      - phone-web
